<!-- ODBUS ABOUT US PAGE -->

<div class="about-page">

  <!-- DESKTOP ABOUT HEADER -->
  <header class="about-desktop-header">
    <div class="about-container">
      <h1>{{ pageTitle || 'About ODBUS' }}</h1>
    </div>
  </header>

  <!-- MOBILE HEADER - KEEP SAME DESIGN -->
  <header class="about-mobile-header">

    <a routerLink="/" class="about-back" aria-label="Back to home">
      <i class="fa fa-arrow-left" aria-hidden="true"></i>
    </a>

    <h1>{{ pageTitle || 'About ODBUS' }}</h1>

    <a routerLink="/" class="about-mobile-logo" aria-label="ODBUS home">
      <img src="assets/img/mob-img/logo.png" alt="ODBUS" width="110" height="42" />
    </a>

  </header>

  <!-- ABOUT CONTENT -->
  <main class="about-main">
    <div class="about-container">

      <article class="about-content-card">
        <div class="about-content" [innerHTML]="pageContent">
        </div>
      </article>

    </div>
  </main>

  <!-- EXISTING MOBILE BOTTOM NAVIGATION -->
  <app-footer-menu class="about-mobile-footer"></app-footer-menu>

</div>
