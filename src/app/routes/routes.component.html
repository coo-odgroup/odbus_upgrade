<section class="opertbg top-routs routes-page">
  <div class="line-span">
    <div class="container routes-heading">
      <a
        href="javascript:void(0)"
        class="routes-back"
        aria-label="Go back"
        (click)="goBack()"
      >
        <i class="fa fa-arrow-left" aria-hidden="true"></i>
      </a>
      <h1>
        <span class="title-desktop">All Routes</span>
        <span class="title-mobile">Popular Routes</span>
      </h1>
      <img
        class="routes-logo"
        src="assets/img/mob-img/logo.png"
        width="105"
        height="42"
        loading="lazy"
        alt="ODBUS"
      />
    </div>
  </div>

  <div class="textimonials-result1">
    <div class="container">
      <div class="main-tnc">
        <div class="routes-search">
          <input
            class="form-control"
            type="search"
            [(ngModel)]="searchText"
            (ngModelChange)="searchRoutes()"
            placeholder="Search Route"
            aria-label="Search Route"
          />
        </div>

        <ul class="routes-list" *ngIf="all_routes.length > 0; else noResults">
          <li *ngFor="let p of all_routes">
            <a
              class="route-card"
              [routerLink]="[
                '/routes',
                p.source_slug + '-' + p.destination_slug + '-bus-services'
              ]"
            >
              <img
                class="route-pin"
                src="assets/img/Icon-metro-location.svg"
                width="18"
                height="18"
                loading="lazy"
                alt=""
              />
              <span class="route-info">
                <span class="route-text">{{ p.source_name }}</span>
                <img
                  class="route-arrow-img"
                  src="assets/img/Group 1.png"
                  width="20"
                  height="10"
                  loading="lazy"
                  alt=""
                />
                <span class="route-arrow" aria-hidden="true">→</span>
                <span class="route-text">{{ p.destination_name }}</span>
              </span>
              <span class="book-btn">Book Now</span>
            </a>
          </li>
        </ul>

        <ng-template #noResults>
          <p *ngIf="searchText && !loading" class="text-center">
            No results found for "{{ searchText }}".
          </p>
        </ng-template>

        <div class="text-center routes-more">
          <button
            *ngIf="hasMore && !loading && !searchText"
            type="button"
            (click)="allRoutes(searchText)"
            class="border-btn bh"
          >
            Load More
          </button>
          <div *ngIf="loading && page_no > 1">Loading...</div>
          <div *ngIf="!hasMore && !searchText">No more records</div>
        </div>
      </div>
    </div>
  </div>

  <app-footer-menu class="routes-footer-menu"></app-footer-menu>
</section>
