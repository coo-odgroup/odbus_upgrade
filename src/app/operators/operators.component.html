<section class="opertbg top-routs operators-page">
  <div class="line-span">
    <div class="container operators-heading">
      <a routerLink="/" class="operators-back" aria-label="Back to home">
        <i class="fa fa-arrow-left" aria-hidden="true"></i>
      </a>
      <h1>
        <span class="title-desktop">All Operators</span>
        <span class="title-mobile">Top Operators</span>
      </h1>
      <img
        class="operators-logo"
        src="assets/img/mob-img/logo.png"
        width="105"
        height="42"
        loading="lazy"
        alt="ODBUS"
      />
    </div>
  </div>

  <div class="textimonials-result1">
    <div class="container">
      <div class="main-tnc">
        <div class="operators-search">
          <input
            type="search"
            class="form-control"
            placeholder="Search operator..."
            aria-label="Search operator"
            [(ngModel)]="searchText"
            (input)="onSearchChange()"
          />
        </div>

        <div class="operators-list-wrap">
          <ul *ngIf="allOperators && allOperators.data.length > 0; else noResults">
            <li *ngFor="let t of allOperators.data">
              <a
                [routerLink]="t.operator_url ? ['/operators', t.operator_url] : null"
              >
                <img
                  class="top-operators-img"
                  src="assets/img/icon-bus-alt.svg"
                  loading="lazy"
                  alt=""
                />
                <i class="fa fa-bus" aria-hidden="true"></i>
                {{ t.organisation_name }}</a
              >
            </li>
          </ul>
        </div>

        <ng-template #noResults>
          <p *ngIf="allOperators" class="text-center">No operators found</p>
        </ng-template>
      </div>
    </div>
  </div>
</section>

<!-- Bottom navigation bar: shown on mobile widths only (see CSS) -->
<app-footer-menu class="operators-footer-menu"></app-footer-menu>
