<div class="mobile-fixed-bottom">
  <div class="footer-menu mobile-bg-danger">

    <!-- HOME -->
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="home">
      <span class="footer-icon">
        <i class="fa fa-home"></i>
      </span>
      <span class="footer-label">Home</span>
    </a>

    <!-- BOOKINGS -->
    <a routerLink="/dashboard" routerLinkActive="active" class="home">
      <span class="footer-icon">
        <i class="fa fa-ticket"></i>
      </span>
      <span class="footer-label">Bookings</span>
    </a>

    <!-- LOGIN / ACCOUNT -->
    <a *ngIf="!session.isLoggedIn()" routerLink="/login" routerLinkActive="active" class="home">
      <span class="footer-icon">
        <i class="fa fa-user"></i>
      </span>
      <span class="footer-label">Login</span>
    </a>

    <a *ngIf="session.isLoggedIn()" routerLink="/myaccount" routerLinkActive="active" class="home">
      <span class="footer-icon">
        <i class="fa fa-user-circle"></i>
      </span>
      <span class="footer-label">Account</span>
    </a>

    <!-- MENU -->
    <button type="button" class="home footer-menu-trigger" [ngClass]="{ active: MenuActive }" (click)="menu()"
      [attr.aria-expanded]="MenuActive" aria-label="Open menu">
      <span class="footer-icon">
        <i class="fa fa-bars"></i>
      </span>
      <span class="footer-label">Menu</span>
    </button>

  </div>
</div>


<!-- MOBILE FULL SCREEN MENU -->
<div
  class="mobile-menu-overlay"
  [class.menu-open]="MenuActive"
  [attr.aria-hidden]="!MenuActive"
  [attr.inert]="!MenuActive ? '' : null"
>

    <!-- TOP -->
    <div class="mobile-menu-header">
      <div class="menu-logo">
        <img src="assets/img/mob-img/logo.png" alt="Footer Logo" />
      </div>

      <div class="menu-close" (click)="MenuActive = false" (keydown.enter)="MenuActive = false"
        (keydown.space)="MenuActive = false" tabindex="0" role="button" aria-label="Close menu">
        <i class="fa fa-times"></i>
      </div>
    </div>

    <!-- USER -->
    <div class="menu-user-box">
      <div class="user-icon">
        <i class="fa fa-user"></i>
      </div>

      <div class="user-content">
        <h4 *ngIf="!session.isLoggedIn()">Welcome Guest</h4>
        <h4 *ngIf="session.isLoggedIn()">Welcome Back</h4>

        <p *ngIf="!session.isLoggedIn()">Login to manage your bookings</p>
        <p *ngIf="session.isLoggedIn()">Manage your account & bookings</p>
      </div>
    </div>

    <!-- MENU LIST -->
    <div class="mobile-menu-list">

      <a routerLink="/dashboard" *ngIf="session.isLoggedIn()">
        <div class="menu-icon">
          <i class="fa fa-list-alt"></i>
        </div>
        <span>Manage Booking</span>
      </a>

      <a routerLink="/login" *ngIf="!session.isLoggedIn()">
        <div class="menu-icon">
          <i class="fa fa-list-alt"></i>
        </div>
        <span>Manage Booking</span>
      </a>

      <a routerLink="/offers">
        <div class="menu-icon">
          <i class="fa fa-gift"></i>
        </div>
        <span>Offers</span>
      </a>

      <a routerLink="/operators">
        <div class="menu-icon">
          <i class="fa fa-bus"></i>
        </div>
        <span>Operators</span>
      </a>

      <a routerLink="/routes">
        <div class="menu-icon">
          <i class="fa fa-map-marker"></i>
        </div>
        <span>Routes</span>
      </a>

      <a routerLink="/faq">
        <div class="menu-icon">
          <i class="fa fa-question-circle"></i>
        </div>
        <span>FAQ's</span>
      </a>

      <a routerLink="/terms-conditions">
        <div class="menu-icon">
          <i class="fa fa-file-text-o"></i>
        </div>
        <span>Terms & Conditions</span>
      </a>

      <a routerLink="/privacy-policy">
        <div class="menu-icon">
          <i class="fa fa-shield"></i>
        </div>
        <span>Privacy Policy</span>
      </a>

      <a routerLink="/about-us">
        <div class="menu-icon">
          <i class="fa fa-info-circle"></i>
        </div>
        <span>About Us</span>
      </a>

      <a routerLink="/blog">
        <div class="menu-icon">
          <i class="fa fa-pencil-square-o"></i>
        </div>
        <span>Blogs</span>
      </a>

      <a *ngIf="session.isLoggedIn()" (click)="signOut()">
        <div class="menu-icon">
          <i class="fa fa-sign-out"></i>
        </div>
        <span>Logout</span>
      </a>

    </div>

    <!-- BOTTOM -->
    <div class="menu-bottom">
      <a routerLink="/login" *ngIf="!session.isLoggedIn()">
        Login / Signup
      </a>

      <a routerLink="/dashboard" *ngIf="session.isLoggedIn()">
        Go To Dashboard
      </a>
    </div>

  </div>
