<!-- ODBUS REFUND & CANCELLATION POLICY PAGE -->

<div class="policy-page">

  <!-- DESKTOP HEADER -->
  <header class="policy-desktop-header">
    <div class="policy-container">
      <h1>{{ pageTitle || 'Cancellation & Refund Policy' }}</h1>
    </div>
  </header>

  <!-- MOBILE HEADER -->
  <header class="policy-mobile-header">

    <a routerLink="/" class="policy-back" aria-label="Back to home">
      <i class="fa fa-arrow-left" aria-hidden="true"></i>
    </a>

    <h1>{{ pageTitle || 'Cancellation & Refund Policy' }}</h1>

    <a routerLink="/" class="policy-mobile-logo" aria-label="ODBUS home">
      <img src="assets/img/mob-img/logo.png" alt="ODBUS Logo" width="110" height="42" />
    </a>

  </header>

  <!-- REFUND POLICY CONTENT -->
  <main class="policy-main">
    <div class="policy-container">

      <article class="policy-content-card">
        <div class="policy-content" [innerHTML]="pageContent">
        </div>
      </article>

    </div>
  </main>

  <!-- MOBILE BOTTOM NAVIGATION -->
  <app-footer-menu class="policy-mobile-footer"></app-footer-menu>

</div>
